name: Upstream check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TITLE: 'Upstream: new ROCm releases available'
  LABELS: 'upstream,ci,release'

jobs:
  check:
    name: Compare with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compare
        id: compare
        run: node .github/scripts/check-upstream.ts report.md
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          FOUND: ${{ steps.compare.outputs.found }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          gh label create upstream --color 1D76DB \
            --description 'New upstream ROCm release or distro' 2>/dev/null || true
          number=$(gh issue list --state open --label upstream --limit 100 \
            --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")
          if [ "$FOUND" != true ]; then
            echo "Nothing new upstream."
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
            echo "Updated #$number"
          else
            gh issue create --title "$TITLE" --body-file report.md \
              --label "$LABELS" --assignee "$ASSIGNEE"
          fi
