name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  install-linux:
    name: Install on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk before
        run: df -h /
      - name: Install ROCm
        id: rocm
        uses: ./
        with:
          version: '10.1.0'
          gfx: gfx1200
      - name: Disk after
        run: df -h /
      - name: Check outputs and environment
        run: |
          echo "ROCM_PATH=$ROCM_PATH HIP_PATH=$HIP_PATH"
          echo "output ROCM_PATH=${{ steps.rocm.outputs.ROCM_PATH }}"
          echo "output version=${{ steps.rocm.outputs.version }}"
          test -d "$ROCM_PATH"
          test "$ROCM_PATH" = "${{ steps.rocm.outputs.ROCM_PATH }}"
          test "${{ steps.rocm.outputs.version }}" = "10.1.0"
      - name: hipcc --version
        run: hipcc --version
      - name: Compile and link a HIP program (not run, no GPU)
        run: hipcc .github/smoke/hello.hip -o hello --offload-arch=gfx1200

  idempotent-linux:
    name: Running twice on ubuntu-24.04
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ROCm (first run)
        id: first
        uses: ./
        with:
          version: '10.1.0'
          gfx: gfx1200
      - name: Install ROCm (second run)
        id: second
        uses: ./
        with:
          version: '10.1.0'
          gfx: gfx1200
      - name: Both runs agree and hipcc works
        run: |
          test "${{ steps.first.outputs.ROCM_PATH }}" = "${{ steps.second.outputs.ROCM_PATH }}"
          test "${{ steps.first.outputs.version }}" = "${{ steps.second.outputs.version }}"
          test -x "$ROCM_PATH/bin/hipcc"
          hipcc --version
          hipcc .github/smoke/hello.hip -o hello --offload-arch=gfx1200
