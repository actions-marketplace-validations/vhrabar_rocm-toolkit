name: Check dist

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dist:
    name: dist/ is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Fail if dist/ changed
        run: |
          git diff --exit-code --stat -- dist/ || {
            echo '::error::dist/ is stale. Run "npm run package" and commit the result.'
            exit 1
          }
